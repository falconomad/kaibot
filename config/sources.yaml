# Free data sources and their request budgets (research 01–05, checked 10 Nov 2026).
# budget = what Kaibot allows itself, kept below the provider's free limit. verify_on_day1 = probe with a live key.
# Enforced by kaibot.common.ratelimit (one process-wide budget per source name below): budget_per_s / _min / _hour
# are sliding windows, min_seconds_between_requests is a minimum gap. Every outgoing call must name its source.
market_data:
  alpaca:           {use: primary, auth: key, limit: "200 req/min REST; WS 30 symbols, 1 conn (IEX)", budget_per_min: 150, verify_on_day1: [movers, corporate_actions_path]}
  alpaca_trading:   {use: paper_orders, auth: key, limit: "200 req/min per account (trading API, separate from data)", budget_per_min: 150}
  alpaca_daily_bars: {use: research_daily_store, auth: key, endpoint: "/v2/stocks/{symbol}/bars timeframe=1Day adjustment=raw|all feed=sip, end >= 15 min old",
                     note: "requests count against alpaca; two per symbol; scripts/fetch_daily.sh runs at 120/min, 40/min while the engine runs; research store data/daily, never in the live path"}
  alpaca_corporate_actions: {use: splits_and_dividends, auth: key, endpoint: "/v1/corporate-actions, 1000 rows a page",
                     note: "requests count against alpaca; a few dozen per run of scripts/fetch_daily.sh; free-plan access and history depth are confirmed by the first run (docs/ops/daily_bars.md)"}
  alpaca_assets:    {use: new_listing_watch_shadow, auth: key, endpoint: "paper-api.alpaca.markets/v2/assets?status=active&asset_class=us_equity",
                     note: "requests count against alpaca_trading (the paper trading host); one a night from scripts/collect_alt.py --source listings; read-only; shadow store data/alt/listings, never in the live path (docs/ops/listings.md)"}
  alpaca_first_bar: {use: new_listing_watch_shadow, auth: key, endpoint: "/v2/stocks/{symbol}/bars timeframe=1Day adjustment=raw feed=sip limit=10, end >= 20 min old",
                     note: "requests count against alpaca; at most 40 a night, one per symbol that looks like a new listing, until its first bar is stored (15 nights at most)"}
  finnhub:          {use: fallback_quotes, auth: key, limit: "60/min, 30/s burst; WS 50 symbols; no candles on free", budget_per_min: 45}
  massive:          {use: nightly_universe, auth: key, limit: "5/min, EOD grouped daily bars", budget_per_min: 4}
  tiingo:           {use: third_fallback, auth: key, limit: "50/hr, 1000/day", budget_per_hour: 40}
  databento:        {use: validation_only, auth: key, billing: "one-time $125 historical credit (portal cap $1/month); credit-only",
                     max_cost_usd: 10, credit_usd: 125, cost_estimate_before_download: required, default_dataset: EQUS.MINI, default_schema: ohlcv-1m,
                     cache: "data/databento (Parquet, per symbol; cached symbols never re-requested)",
                     ledger: "data/databento/ledger.jsonl (estimated spend of every confirmed download; total never past credit_usd)", budget_per_min: 20,
                     note: "historical validation only, never in the live path; scripts/fetch_databento.py is dry-run unless --confirm; bbo-1m spread calibration of cost model v2: scripts/fetch_spread_calibration.py plan / report (offline)"}
  allinvestview_logo_search: {use: dashboard_logo_domains, auth: none, endpoint: "https://www.allinvestview.com/api/logo-search/?q=SYMBOL",
                     limit: "60 req/min per IP", budget_per_min: 45,
                     note: "ticker -> company website for the cdn.tickerlogos.com logos (#330, #331); only scripts/fetch_symbol_meta.py --fill-domains, paced at one call every 1.2 s, and the dashboard (apps/web/api/logo-domain.ts, its own limit of 50/min); never in the engine"}
  yfinance:         {use: offline_research_only, auth: none, note: "unofficial; never in the live decision path"}
fundamentals_filings:
  sec_edgar:        {use: core, auth: user_agent_with_email, limit: "10 req/s fair access", budget_per_s: 5, note: "shared by every SEC host (www.sec.gov, data.sec.gov): Atom feed, submissions, Form 4, companyfacts"}
  sec_earnings_8k:  {use: research_earnings_dates, endpoint: "data.sec.gov/submissions/CIK##########.json (+ older files), www.sec.gov/files/company_tickers.json, www.sec.gov/Archives/edgar/cik-lookup-data.txt",
                     note: "requests count against sec_edgar; scripts/fetch_earnings_dates.sh: about 2,000 on the first run, about 700 per --refresh; research store data/earnings, never in the live path"}
  sec_filings_8k:   {use: research_8k_items, endpoint: "data.sec.gov/submissions/CIK##########.json (+ older files)",
                     note: "requests count against sec_edgar (same budget, 5 req/s; SEC's fair-access limit is 10); scripts/fetch_earnings_dates.sh --all-items: about 2,000 on the first run, about 700 per --all-items --refresh; research store data/filings, never in the live path (docs/ops/filings_8k.md)"}
  finnhub_earnings_calendar: {use: research_forward_calendar, auth: key, endpoint: "/api/v1/calendar/earnings?from&to (token in X-Finnhub-Token header)",
                     note: "requests count against finnhub; 10 per daily snapshot (64 days in 7-day chunks); free-plan access confirmed by the first run, a 401/403/429 is logged as unavailable"}
  sec_spinoff_8k:   {use: research_spinoff_ratios_shadow, endpoint: "data.sec.gov/submissions/CIK##########.json (+ older files), www.sec.gov/Archives/edgar/data/{cik}/{accession}/ (8-K documents, index.json), www.sec.gov/files/company_tickers.json",
                     note: "requests count against sec_edgar; scripts/fetch_spinoffs.sh: at most about 100 per spin-off on the first run (1-3 for the parent's filing list, then up to 25 8-Ks of 1-5 documents each), none for a spin-off already read; research store data/spinoffs, shadow only, never in the live path (docs/ops/spinoff_ratios.md)"}
  sec_edgar_atom:   {use: 8k_and_form4_stream, poll_seconds: 30, note: "requests count against sec_edgar"}
  sec_listings:     {use: new_listing_watch_shadow, endpoint: "www.sec.gov/Archives/edgar/daily-index/YYYY/QTRn/master.YYYYMMDD.idx, /full-index/YYYY/QTRn/master.idx, data.sec.gov/submissions/CIK##########.json, www.sec.gov/Archives/edgar/data/{cik}/{accession}.txt (first 200 kB), www.sec.gov/files/company_tickers.json",
                     note: "requests count against sec_edgar; nightly (scripts/collect_alt.py --source listings): 1-2 daily indexes, then one per company with a fresh 8-A12B or 424B4 and one per new prospectus, about 20-100 in all, a few hundred on the first run (120 days of indexes); history (scripts/fetch_listings.py): one per quarter, about 45 since 2016; shadow / research stores data/alt/listings and data/listings, never in the live path (docs/ops/listings.md)"}
  nasdaq_trader:    {use: new_listing_watch_shadow, schedule: nightly, limit: "static files and one news feed; no published limit", min_seconds_between_requests: 1,
                     endpoint: "www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt, /otherlisted.txt, /rss.aspx?feed=currentheadlines&categorylist=48 (Data Technical News), /TraderNews.aspx?id=... (a notice page, at most 5 a night)",
                     note: "3 requests a night plus one per new listing notice; URLs and layouts not verified from the build sandbox (host blocked there): the first run on the Mac confirms them (docs/ops/listings.md)"}
  finra_regsho:     {use: daily_short_volume, schedule: "after 18:00 ET", limit: "static CDN files", min_seconds_between_requests: 1}
  fred:             {use: regime, auth: key, limit: "120 req/min per key", budget_per_min: 30}
  fred_vixcls:      {use: regime, schedule: daily, note: "VIX via FRED (Cboe CSV unreachable from our network, 10 Nov 2026); requests count against fred"}
  fred_dtb3:        {use: research_cash_yield, schedule: "on demand", note: "3-month Treasury-bill rate (DTB3) for evaluation reports (M11 2.4, scripts/fetch_tbill.py): one request a run, counts against fred; research input only, never in the live path"}
  gdelt_pacing:     {min_seconds_between_requests: 6, note: "GDELT returns 429 when called faster (one every 5 s); enforced on gdelt_doc"}
news:
  alpaca_news_ws:   {use: primary_stream, auth: key, note: "Benzinga feed; verify free status + latency day 1"}
  alpaca_news_rest: {use: engine_news_poller, auth: key, endpoint: "/v1beta1/news (50 symbols and 50 stories a request)",
                     note: "requests count against alpaca; src/kaibot/ingest/news_poll.py inside the engine: every 5 min weekdays 04:00-20:00 ET, 30 min otherwise; about 2-3 requests a poll for ~75 symbols (about 600 a weekday, 150 a weekend day); free plan confirmed 19 Nov 2026; KAIBOT_NEWS_POLL=off stops it"}
  finnhub_news:     {use: secondary, budget_per_min: 10}
  pr_newswire_rss:  {use: primary_source, poll_seconds: 60}
  globenewswire_rss: {use: primary_source, poll_seconds: 60}
  gdelt_doc:        {use: macro_geo, auth: none, poll_seconds: 900, min_seconds_between_requests: 6}
nlp:
  finbert_local:    {use: cheap_sentiment, note: "CPU, non-commercial licence: fine for paper, review before live"}
  claude:           {use: triage_and_room, models: {triage: claude-haiku-5-5, room: claude-sonnet-5-5}, monthly_alert_usd: 150, monthly_hard_stop_usd: 190}
