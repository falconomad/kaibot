# US listings worth at least $100 billion at the offer price, 2016 onward, with dated follow-ups. `known_since`
# is the first date the session and the offer price were both public (the alarm reads an entry only from then).
# None before 2026: the largest US listings of 2016-2025 were well under $100 billion at their offer price (Uber
# 2019, Rivian 2021, Arm 2023; from memory, not re-checked) and are not listed.
mega_listing:
  - symbol: SPCX
    company: Space Exploration Technologies (SpaceX)
    first_session: 2026-06-12
    known_since: 2026-06-11
    offer_price_usd: 135
    note: "priced at $135 on Thu 11 Jun, first trade 12 Jun on Nasdaq; about $2 trillion at the $150 opening price"
    source: "https://builtin.com/articles/spacex-ipo-valuation-20260612 (read 20 Nov 2026)"
    follow_ups: []  # options start, index entry and lock-up end not collected
  - symbol: ANT
    company: Anthropic
    first_session: 2026-11-19
    known_since: 2026-11-18
    offer_price_usd: 83
    note: "980 million shares at $83, priced 18 Nov; Nasdaq notice of 11 Nov named 19 Nov; about $1.1 trillion at the offer price"
    source: "https://www.anthropic.com/news/anthropic-prices-initial-public-offering (read 20 Nov 2026); Nasdaq DTN2026-28"
    follow_ups:
      # As reported (StockAnalysis, 17 Nov 2026, citing Bloomberg): Nasdaq-100 entry at the open of 21 Dec, so at
      # the close of 18 Dec, announced after the close of 11 Dec. Read only from 11 Dec; correct it if it moves.
      - {kind: index_entry, session: 2026-12-18, known_since: 2026-12-11,
         source: "https://stockanalysis.com/news/anthropic-nasdaq-100-funds-december-21/"}
