# Market-event alarm inputs (story S103, #377; docs/prereg/market_alarm_study.md). Read only by
# kaibot.features.market_alarm, never by the order path: a stale or wrong entry loses or adds a notice and blocks
# nothing. Kept apart from config/macro_calendar.yaml on purpose: the engine's entry blackouts read that file and
# reject unknown keys, so nothing here can change a blackout or a replay. Dates are New York session dates.
#
# Extend every autumn with config/macro_calendar.yaml. `covers_until` is per list: the alarm reports a list whose
# date has passed as stale (no notice from it) instead of guessing.
covers_until:
  sp500_quarterly: 2027-12-31
  russell_recon: 2026-12-31
  nasdaq100_annual: 2027-12-31
  mega_listing: 2026-12-31

# The session at whose close the change takes effect (the indexes open changed on the next session).
index_reshuffle:
  # S&P 500 quarterly rebalance: "effective after the close of the third Friday of March, June, September and
  # December" (S&P Dow Jones Indices, Equity Indices Policies & Practices). Derived by that rule with
  # kaibot.ingest.nyse_sessions; when the third Friday is not a session the last session before it counts
  # (2026-06-19 Juneteenth: the June 2026 changes were "effective prior to the open of trading on Monday,
  # June 22, 2026, to coincide with the quarterly rebalance", S&P press release of 5 Jun 2026, read 20 Nov 2026).
  sp500_quarterly: [2016-03-18, 2016-06-17, 2016-09-16, 2016-12-16, 2017-03-17, 2017-06-16, 2017-09-15, 2017-12-15,
                    2018-03-16, 2018-06-15, 2018-09-21, 2018-12-21, 2019-03-15, 2019-06-21, 2019-09-20, 2019-12-20,
                    2020-03-20, 2020-06-19, 2020-09-18, 2020-12-18, 2021-03-19, 2021-06-18, 2021-09-17, 2021-12-17,
                    2022-03-18, 2022-06-17, 2022-09-16, 2022-12-16, 2023-03-17, 2023-06-16, 2023-09-15, 2023-12-15,
                    2024-03-15, 2024-06-21, 2024-09-20, 2024-12-20, 2025-03-21, 2025-06-20, 2025-09-19, 2025-12-19,
                    2026-03-20, 2026-06-18, 2026-09-18, 2026-12-18, 2027-03-19, 2027-06-17, 2027-09-17, 2027-12-17]
  # Russell US indexes reconstitution: the fourth Friday of June through 2025 (FTSE Russell, Russell US Equity
  # Indices Construction and Methodology); semi-annual from 2026: "final after the close of ... Friday 26th June"
  # (LSEG press release of 2 Mar 2026) and "take effect after the close of US equity markets" on Friday
  # 11 December 2026 (LSEG press release of 1 Sep 2026), both read 20 Nov 2026. 2027 dates are not announced yet.
  russell_recon: [2016-06-24, 2017-06-23, 2018-06-22, 2019-06-28, 2020-06-26, 2021-06-25, 2022-06-24, 2023-06-23,
                  2024-06-28, 2025-06-27, 2026-06-26, 2026-12-11]
  # Nasdaq-100 annual reconstitution: effective before the open of the Monday after the third Friday of December
  # (Nasdaq-100 Index Methodology), so at the close of that Friday. Derived by that rule. Special and fast-entry
  # changes are not "the annual change" and are not listed here (a fast entry of a mega listing is a follow-up of
  # `mega_listing` below).
  nasdaq100_annual: [2016-12-16, 2017-12-15, 2018-12-21, 2019-12-20, 2020-12-18, 2021-12-17, 2022-12-16, 2023-12-15,
                     2024-12-20, 2025-12-19, 2026-12-18, 2027-12-17]

