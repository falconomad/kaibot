# Event blackouts (PRD v2: no new entries +-30 min around FOMC and CPI). Times are America/New_York.
# The engine refuses new entries after `covers_until` (fail closed): extend this file every autumn, when the
# Fed (tentative schedule, usually August/September) and BLS publish the next year.
# 2027: FOMC from the Fed's 5 Sep 2025 release of its tentative 2027 schedule; CPI from bls.gov/schedule/news_release/cpi.htm (read 10 Nov 2026).
covers_until: 2027-12-31
# 2016-2024 (for replays): second day of each scheduled meeting, from the Fed's tentative-schedule releases
# (2015-05-11, 2016-06-28, 2017-05-11, 2018-05-25, 2019-05-17, 2020-07-02 ...) and federalreserve.gov calendars.
# 2020-03-18 is omitted: that meeting was replaced by the emergency move of Sunday 2020-03-15 (no session).
# Unscheduled statements during the session are listed separately with their actual release time.
fomc_unscheduled_1000: [2020-03-03]
# Sources: FOMC statements from federalreserve.gov/monetarypolicy/fomccalendars.htm (read 10 Nov 2026);
# CPI release dates from FRED release_id=10 (read 10 Nov 2026). CPI is published 08:30 ET, before the open,
# so it only blacks out entries if the window overlaps the session (it does not); kept for the open-gap filter.
