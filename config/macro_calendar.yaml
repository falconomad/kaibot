# Event blackouts (PRD v2: no new entries +-30 min around FOMC and CPI). Times are America/New_York.
# The engine refuses new entries after `covers_until` (fail closed): extend this file every autumn, when the
# Fed (tentative schedule, usually August/September) and BLS publish the next year.
# 2027: FOMC from the Fed's 5 Sep 2025 release of its tentative 2027 schedule; CPI from bls.gov/schedule/news_release/cpi.htm (read 10 Nov 2026).
covers_until: 2027-12-31
