name: ci
on:
  push:
    branches: [main]
  pull_request:
# M12 ticket 3.6 (#468): the token every job gets can read the repository and nothing else; actions are pinned by
# commit (the tag is in the comment), checkouts keep no credentials, and no job has a secret. The `supply-chain`
# workflow and tests/unit/test_ci_supply_chain.py hold all workflows to this.
permissions:
  contents: read
jobs:
  python-tests:  # the suite in two disjoint parts on two runners (#221); `python` below is the check to require
    name: python-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: ["1/2", "2/2"]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}  # full history: the pre-registration check reads it (#161)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with: {version: "0.11.32", enable-cache: true}  # same uv as scripts/lock_deps.sh was run with
      - run: ./scripts/lock_deps.sh --check  # uv.lock and the requirements exports agree (one locked set, #122)
      - run: uv sync --locked
      - run: uv run ruff check .
      # KAIBOT_TEST_SHARD (tests/conftest.py) puts every test in exactly one part; 4 xdist workers per runner
      # (4 vCPU, 16 GB). Same tests and Hypothesis example counts as plain `pytest -q`. See docs/ops/hygiene.md.
      # M12 3.8 (#470): the test-writing agent's sandbox needs unprivileged user and mount namespaces (unshare -rmn,
      # then a chroot); Ubuntu's runner blocks them with AppArmor by default. Lifted for this job only, so the
      # sandbox tests run (KAIBOT_REQUIRE_SANDBOX=1 makes them fail, not skip, when the sandbox is missing).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: pytest
        # #256: the SQL tests get a throwaway local Postgres 16 with every migration (tests/pg_scratch.py; the runner
        # has the binaries); `-rs` prints why anything is skipped, and more skips than docs/ops/skipped_tests.md
        # accounts for (KAIBOT_MAX_SKIPPED, per part) fail the part
        env: {KAIBOT_TEST_SHARD: "${{ matrix.shard }}", KAIBOT_TEST_PG_AUTO: "1", KAIBOT_MAX_SKIPPED: "3",
              KAIBOT_REQUIRE_SANDBOX: "1"}
        run: |
          (while sleep 2; do free -m | awk '/^Mem:/{print $3}'; done) > mem.txt & sampler=$!
          rc=0; uv run pytest -q -rs -n 4 --dist worksteal --durations=30 || rc=$?; kill $sampler
          echo "part $KAIBOT_TEST_SHARD on $(lscpu | sed -n 's/^Model name: *//p'): peak memory used \
          $(sort -n mem.txt | tail -1) of $(free -m | awk '/^Mem:/{print $2}') MB" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
  python:  # the required check, same name as before #221: green only when every part of the suite passed
    needs: python-tests
    if: always()  # a skipped check would count as passed; this job must fail instead
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env: {RESULT: "${{ needs.python-tests.result }}"}
  migrations-record:  # audit 2 5.6 (#686): read-only, repo only (no database, no secret, no network but the install)
    # migrations/ numbered 0001.. without a gap, one entry each in docs/ops/migrations_pending.md, the summary line
    # agreeing, and no runbook in docs/ops/ calling an applied migration "not applied". Also inside the suite; its
    # own job so it can be a required check by name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - run: uv run pytest -q -p no:xdist tests/test_migrations_pending_hygiene.py
  hygiene:  # non-blocking for now (#122): type and import-rule counts; baseline in docs/ops/hygiene.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - name: mypy
        continue-on-error: true  # non-blocking: keeps the check green, the count is in the summary
        run: |
          set +e; uv run mypy > mypy.txt 2>&1; rc=$?; tail -1 mypy.txt
          echo "mypy: $(tail -1 mypy.txt)" >> "$GITHUB_STEP_SUMMARY"; exit $rc
      - name: import rules
        continue-on-error: true
        run: |
          set +e; PYTHONPATH=src uv run lint-imports > imports.txt 2>&1; rc=$?
          n=$(grep -c '^-   ' imports.txt); grep -E 'KEPT|BROKEN|^Contracts:' imports.txt
          echo "import rules: $(grep '^Contracts:' imports.txt) ($n broken import chains)" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
  image:  # the engine image builds from the locked requirements and its entry points import (#122); runs in parallel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - run: |
          base=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' Dockerfile); echo "pinned base: $base"
          echo "python:3.13-slim today: $(docker buildx imagetools inspect python:3.13-slim | sed -n 's/^Digest: *//p')"
      - run: docker build -q -t kaibot-engine --build-arg CODE_SHA=ci .
      - run: >-
          docker run --rm kaibot-engine python -c "import kaibot.engine.__main__, kaibot.engine.watchdog,
          kaibot.evaluation.gate_report; print('engine image ok')"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # audit 2 7.3 (#713): what ships to the browser has no high or critical advisory (blocking). The dev tools are
      # audited too, not blocking yet: vitest 2 pulls in tinypool, vite-node and esbuild with open advisories, and
      # the fix is the major upgrade to vitest 4.1.11 or later (a frontend story). Make it blocking after that.
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev tools, not blocking yet)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-only
