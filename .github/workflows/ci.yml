name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-tests:  # the suite in two disjoint parts on two runners (#221); `python` below is the check to require
    name: python-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: ["1/2", "2/2"]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # full history: the pre-registration amendment check reads it (#161)
      - uses: astral-sh/setup-uv@v3
        with: {version: "0.11.32", enable-cache: true}  # same uv as scripts/lock_deps.sh was run with
      - run: ./scripts/lock_deps.sh --check  # uv.lock and the requirements exports agree (one locked set, #122)
      - run: uv sync --locked
      - run: uv run ruff check .
      # KAIBOT_TEST_SHARD (tests/conftest.py) puts every test in exactly one part; 4 xdist workers per runner
      # (4 vCPU, 16 GB). Same tests and Hypothesis example counts as plain `pytest -q`. See docs/ops/hygiene.md.
      - name: pytest
        # #256: the SQL tests get a throwaway local Postgres 16 with every migration (tests/pg_scratch.py; the runner
        # has the binaries); `-rs` prints why anything is skipped, and more skips than docs/ops/skipped_tests.md
        # accounts for (KAIBOT_MAX_SKIPPED, per part) fail the part
        env: {KAIBOT_TEST_SHARD: "${{ matrix.shard }}", KAIBOT_TEST_PG_AUTO: "1", KAIBOT_MAX_SKIPPED: "3"}
        run: |
          (while sleep 2; do free -m | awk '/^Mem:/{print $3}'; done) > mem.txt & sampler=$!
          rc=0; uv run pytest -q -rs -n 4 --dist worksteal --durations=30 || rc=$?; kill $sampler
          echo "part $KAIBOT_TEST_SHARD on $(lscpu | sed -n 's/^Model name: *//p'): peak memory used \
          $(sort -n mem.txt | tail -1) of $(free -m | awk '/^Mem:/{print $2}') MB" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
  python:  # the required check, same name as before #221: green only when every part of the suite passed
    needs: python-tests
    if: always()  # a skipped check would count as passed; this job must fail instead
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python-tests.result }}" = success
  hygiene:  # non-blocking for now (#122): type and import-rule counts; baseline in docs/ops/hygiene.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - name: mypy
        continue-on-error: true  # non-blocking: keeps the check green, the count is in the summary
        run: |
          set +e; uv run mypy > mypy.txt 2>&1; rc=$?; tail -1 mypy.txt
          echo "mypy: $(tail -1 mypy.txt)" >> "$GITHUB_STEP_SUMMARY"; exit $rc
      - name: import rules
        continue-on-error: true
        run: |
          set +e; PYTHONPATH=src uv run lint-imports > imports.txt 2>&1; rc=$?
          n=$(grep -c '^-   ' imports.txt); grep -E 'KEPT|BROKEN|^Contracts:' imports.txt
          echo "import rules: $(grep '^Contracts:' imports.txt) ($n broken import chains)" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
  image:  # the engine image builds from the locked requirements and its entry points import (#122); runs in parallel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' Dockerfile); echo "pinned base: $base"
          echo "python:3.13-slim today: $(docker buildx imagetools inspect python:3.13-slim | sed -n 's/^Digest: *//p')"
      - run: docker build -q -t kaibot-engine --build-arg CODE_SHA=ci .
      - run: >-
          docker run --rm kaibot-engine python -c "import kaibot.engine.__main__, kaibot.engine.watchdog,
          kaibot.evaluation.gate_report; print('engine image ok')"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-only
