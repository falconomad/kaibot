name: label PRs by team
# `pull_request_target` runs with the base repository's token so that a pull request from a fork can be labelled.
# That is safe only as long as this workflow never checks out or runs the pull request's code: it does neither
# (actions/labeler reads the list of changed files from the API). tests/unit/test_ci_supply_chain.py keeps it so.
on: [pull_request_target]  # zizmor: ignore[dangerous-triggers] no checkout, no code from the pull request is run
permissions: {}
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to set the labels (the write permissions of CI are listed in test_ci_supply_chain.py)
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
