name: ci-experiment-221  # temporary (#221): compares pytest settings on separate runners; removed before merge
on:
  pull_request:
    paths: [".github/workflows/ci-experiment-221.yml"]
jobs:
  exp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cfg: ["n4", "n4-1thread", "n6-1thread", "n4-nowarn"]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v3
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'; nproc; free -m
      - name: pytest
        run: |
          n=4; [ "${{ matrix.cfg }}" = n6-1thread ] && n=6
          extra=""; [ "${{ matrix.cfg }}" = n4-nowarn ] && extra="-p no:warnings"
          if [ "${{ matrix.cfg }}" = n4-1thread ] || [ "${{ matrix.cfg }}" = n6-1thread ]; then export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1; fi
          (while sleep 2; do free -m | awk '/^Mem:/{print $3}'; done) > mem.txt & sampler=$!
          start=$(date +%s); rc=0; uv run pytest -q -n $n --dist worksteal $extra 2>&1 | tail -3 || rc=$?
          kill $sampler; echo "cfg=${{ matrix.cfg }} secs=$(( $(date +%s) - start )) peakMB=$(sort -n mem.txt | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
