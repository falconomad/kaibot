# M12 ticket 3.6 (#468): the build's supply chain, checked on every pull request and once a week (a new advisory
# can appear without any change here).
#   lock      uv.lock and the hash-pinned requirements exports agree (that every requirement carries a hash, and the
#             rules below for the workflows, are also pinned by tests/unit/test_ci_supply_chain.py in the `ci` run)
#   pip-audit known vulnerabilities in what the engine image installs, in the research and ml sets and in the dev tools
#   zizmor    the workflows themselves: actions pinned by commit, read-only token, no credentials left behind
# The two tools are locked with hashes in .github/audit/uv.lock. No job here, or anywhere in CI, has a secret.
name: supply-chain
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
permissions:
  contents: read
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with: {version: "0.11.32", enable-cache: true}
      - name: lockfile and hash-pinned exports
        run: |
          ./scripts/lock_deps.sh --check
          uv lock --check --project .github/audit
      - name: pip-audit (engine image, research set, dev tools)
        run: |
          uv export --frozen --all-groups --all-extras --no-emit-project --format requirements-txt --quiet > /tmp/requirements-dev.txt
          for f in requirements-engine.txt requirements-research.txt requirements-ml.txt /tmp/requirements-dev.txt; do
            echo "::group::pip-audit $f"
            uv run --project .github/audit --locked pip-audit -r "$f" --require-hashes --disable-pip \
              --progress-spinner off --desc on
            echo "::endgroup::"
          done
      - name: zizmor (workflow audit)
        run: uv run --project .github/audit --locked zizmor --offline --min-severity low .github/workflows
