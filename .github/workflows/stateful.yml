# M12 ticket 3.1 (#463): the stateful property test over the order manager and the ledger (tests/stateful/) with a
# larger, bounded example budget than the ordinary test run pays, and branch coverage of the modules under test.
# The ordinary `ci` run already runs the same tests with the small default budget; this job is the deeper search.
name: stateful
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 6"  # Saturdays 04:23 UTC: the weekly random-seed run (job `weekly-random-seeds`)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stateful-${{ github.ref }}
  cancel-in-progress: true
jobs:
  orders-and-ledger:  # pull requests and main: derandomised, so one pull request never gets a draw another did not
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # the bound on the search: the budget below takes about half a minute
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - name: state machine, 300 examples of up to 50 steps, branch coverage
        env: {KAIBOT_STATEFUL_EXAMPLES: "300", KAIBOT_STATEFUL_STEPS: "50"}
        run: |
          uv run coverage run --branch \
            --include='src/kaibot/engine/orders.py,src/kaibot/engine/ledger.py,src/kaibot/engine/targets.py,src/kaibot/engine/execution.py' \
            -m pytest tests/stateful -q -p no:cacheprovider --hypothesis-show-statistics
      - name: coverage summary
        if: always()
        run: |
          uv run coverage report --show-missing | tee coverage.txt
          { echo '### Stateful test: branch coverage of the modules under test'; echo '```'; cat coverage.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
  # QA's suggestion on #494: once a week a search nobody has run before. A fresh seed, not derandomised, a larger
  # budget, and the Hypothesis search for the planted bugs (a measure of the search's reach). This job runs the
  # repository's code with a read-only token and hands its log to `weekly-report` as an artifact (#561); that job,
  # which runs no repository code, opens an issue with the seed and the shrunk program, or comments on the open one.
  weekly-random-seeds:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.search.outcome }}
      seed: ${{ steps.search.outputs.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with: {version: "0.11.32", enable-cache: true}
      - run: uv sync --locked
      - name: state machine, random seed, 1500 examples of up to 50 steps
        id: search
        env: {KAIBOT_STATEFUL_RANDOM: "1", KAIBOT_STATEFUL_HUNT: "1", KAIBOT_STATEFUL_EXAMPLES: "1500",
              KAIBOT_STATEFUL_STEPS: "50"}
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) + 1 ))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "seed $seed" | tee -a "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          uv run pytest tests/stateful -q -p no:cacheprovider --hypothesis-seed="$seed" 2>&1 | tee stateful.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with: {name: stateful-log, path: stateful.log, if-no-files-found: ignore, retention-days: 30}
  weekly-report:
    # the weekly search failed: opens an issue (or comments on the open one). Runs no repository code: it reads the
    # search's log from its artifact and the seed from the job's output.
    needs: weekly-random-seeds
    if: always() && needs.weekly-random-seeds.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write  # to open the issue with the failing seed: the only thing this job writes
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: {name: stateful-log}
        continue-on-error: true
      - name: open an issue with the failing seed
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.weekly-random-seeds.outputs.seed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          touch stateful.log
          {
            echo "The weekly random-seed run of the stateful test (\`tests/stateful/\`) failed."
            echo
            echo "- seed: \`$SEED\`"
            echo "- commit: \`$COMMIT\`"
            echo "- run: $RUN_URL"
            echo
            echo "Run it again:"
            echo
            echo '```'
            echo "KAIBOT_STATEFUL_RANDOM=1 KAIBOT_STATEFUL_HUNT=1 KAIBOT_STATEFUL_EXAMPLES=1500 KAIBOT_STATEFUL_STEPS=50 \\"
            echo "  PYTHONPATH=src pytest tests/stateful -q -p no:cacheprovider --hypothesis-seed=$SEED"
            echo '```'
            echo
            echo "What failed, and the shrunk program where Hypothesis printed one (invariant calls left out):"
            echo
            echo '```'
            grep -v 'state\.inv[0-9]' stateful.log | grep -E '^(E  |FAILED|ERROR)|state\.|Error' | head -120
            echo '```'
            echo
            echo "If it is an engine defect: a minimal failing case, a strict xfail and an entry in \`KNOWN\`"
            echo "(\`tests/stateful/om_machine.py\`). If \`test_the_search_finds_a_planted_bug\` is what failed, the"
            echo "search missed a planted defect within its budget: a question about the search's reach, not the engine."
          } > issue.md
          title="Stateful weekly random-seed run failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title (seed $SEED)" --body-file issue.md \
              --label bug --label team:qa-ops
          fi
