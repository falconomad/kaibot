<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The name is written once, in src/brand/brand.ts; the build puts it where the BRAND placeholder stands (vite.config.ts). -->
    <title>%BRAND% · paper</title>
    <meta name="application-name" content="%BRAND%" />
    <meta name="apple-mobile-web-app-title" content="%BRAND%" />
    <!-- The installable web app (#481): opened from the home screen it runs in its own window. iOS before 17.4 reads this tag instead of the manifest's "display"; the status bar stays a plain dark bar above the page ("black"), so nothing slides under the clock. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- ?v= forces browsers to fetch new icons after a logo change: bump it when the icons change. The icons are drawn from Design's files in src/brand/logo/ (`npm run icons`); the manifest is written by the build. -->
    <link rel="icon" href="/favicon.ico?v=k1" sizes="32x32" />
    <link rel="icon" href="/src/brand/logo/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=k1" />
    <link rel="manifest" href="/manifest.webmanifest?v=k2" />
    <!-- Outfit, the interface font (self-hosted, SIL OFL 1.1): all four weights load first, so no text is laid out twice. These are the
         "core" cuts (42 kB, scripts/subset_fonts.py): the characters the dashboard writes. The full Latin files are fetched only for a
         page that shows an accented letter or another rarer character (tokens.css). -->
    <link rel="preload" href="/fonts/outfit-core-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-core-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-core-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-core-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Inter is only the fallback behind Outfit and its measured Arial (tokens.css), so its stylesheet from another host must
         not hold up the first paint (#297): it is fetched as a print sheet, which never blocks, and applies once loaded. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <meta name="theme-color" content="#0A0B0D" />
    <!-- The hosts the first screen talks to next: the data API (the build fills the address in from the env) and the logos (AllInvestView's ticker-logo CDN, fetched with CORS for the tile colour). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://cdn.tickerlogos.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
