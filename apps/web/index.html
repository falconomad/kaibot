<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The name is written once, in src/brand/brand.ts; the build puts it where the BRAND placeholder stands (vite.config.ts). -->
    <title>%BRAND% · paper</title>
    <meta name="application-name" content="%BRAND%" />
    <meta name="apple-mobile-web-app-title" content="%BRAND%" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- ?v= forces browsers to fetch new icons after a logo change: bump it when the icons change. The icons are drawn from Design's files in src/brand/logo/ (`npm run icons`); the manifest is written by the build. -->
    <link rel="icon" href="/favicon.ico?v=k1" sizes="32x32" />
    <link rel="icon" href="/src/brand/logo/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=k1" />
    <link rel="manifest" href="/manifest.webmanifest?v=k1" />
    <!-- Outfit, the interface font (self-hosted, SIL OFL 1.1): the two weights the first screen uses load first. -->
    <link rel="preload" href="/fonts/outfit-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="preconnect" href="https://static2.finnhub.io" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
