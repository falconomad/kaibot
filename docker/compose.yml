# One small VM: worker (engine), api, watchdog, caddy. Supabase + the web app are hosted separately.
services:
  worker:
    build: {context: .., dockerfile: docker/Dockerfile}
    command: python -m kaibot.engine.run
    env_file: ../.env
    restart: unless-stopped
    volumes: ["../data:/app/data"]
  watchdog:
    build: {context: .., dockerfile: docker/Dockerfile}
    command: python -m kaibot.engine.watchdog
    env_file: ../.env
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: docker/Dockerfile}
    command: uvicorn kaibot_api.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    restart: unless-stopped
