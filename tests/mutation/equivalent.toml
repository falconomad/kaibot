# Surviving mutants that cannot change behaviour (M12 ticket 3.5, #467), with the reason. scripts/mutation_run.py
# does not report them again. `mutant` is the name mutmut prints (a glob is allowed). mutmut numbers the
# mutants of a function in order, so an edit of that function renumbers them: a stale entry then hides nothing
# that matters only if the reason still holds. Check them when the function changes.

