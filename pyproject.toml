[project]
name = "kaibot"
version = "0.1.0"
description = "Autonomous paper day-trading engine for US stocks: free data, multi-agent decision room, deterministic risk gate"
readme = "README.md"
requires-python = ">=3.12"  # tech design targets 3.13
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "websockets>=12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "pandas>=2.2",
  "numpy>=2.0",
  "anthropic>=0.40",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "datasketch>=1.6",
  "structlog>=24.1",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["import-linter>=2.1", "pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "respx>=0.21", "freezegun>=1.5"]
nlp = ["transformers>=4.44", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaibot", "apps/api/kaibot_api"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/design"]  # generators for design-canvas HTML, not app code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/api"]
