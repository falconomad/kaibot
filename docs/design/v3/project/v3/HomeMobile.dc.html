<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaibot · Home on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#7FB2FF}a:hover{color:#B3D1FF}
.num{font-variant-numeric:tabular-nums}
/* motion: one easing, short durations; everything stops for prefers-reduced-motion */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
@keyframes kb-riseY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes kb-ring{from{stroke-dasharray:0 239}}
@keyframes kb-shimmer{from{background-position:-600px 0}to{background-position:600px 0}}
.rise{transform-box:view-box;animation:kb-riseY 1.1s var(--ease) .15s both}
.rise-bar{transform-box:view-box;animation:kb-riseY .8s var(--ease) both}
.rise-up{transform-origin:bottom;animation:kb-riseY .6s var(--ease) both}
.ring{animation:kb-ring 1.1s var(--ease) .3s both}
.sk{display:block;background:linear-gradient(90deg,#16181C 0%,#23272E 50%,#16181C 100%);background-size:1200px 100%;animation:kb-shimmer 1.5s linear infinite;border-radius:10px}

@keyframes kb-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes kb-fade{from{opacity:0}to{opacity:1}}
@keyframes kb-draw{to{stroke-dashoffset:0}}
@keyframes kb-pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
@keyframes kb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter{animation:kb-rise .55s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:kb-draw 1.3s var(--ease) .25s forwards}
.fade{animation:kb-fade .6s var(--ease) .9s both}
.grow{transform-origin:left;animation:kb-grow .8s var(--ease) .3s both}
.live-dot{border-radius:999px;animation:kb-pulse 2s infinite}
.morph{transition:d .45s var(--ease),cy .45s var(--ease)}
.press{transition:transform .15s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),opacity .2s}
.press:hover{filter:brightness(1.12)}.press:active{transform:scale(.97)}
.lift{transition:transform .2s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease)}
.lift:hover{transform:translateY(-2px);border-color:#3A404A}
.row{transition:background-color .2s var(--ease)}.swap{animation:kb-rise .35s var(--ease) both}
.tabbar{display:none}
@media (max-width: 760px){
  .topnav{display:none!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-around;padding:8px 8px 20px;background:rgba(10,11,13,.92);backdrop-filter:blur(12px);border-top:1px solid #1B1E24}
  .page{padding:16px 16px 96px!important;gap:16px!important}
  .bar{padding:12px 16px!important;gap:12px!important}
  .hero{font-size:44px!important}
  .h1{font-size:30px!important}
  .hide-sm{display:none!important}
  .full-sm{flex:1 1 100%!important;width:100%}
  .cols{grid-template-columns:minmax(0,1fr)!important}
  .card{border-radius:20px!important;padding:16px!important}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.sk{background:#1B1E24}}

button:focus-visible,a:focus-visible{outline:2px solid #4F95F0;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0B0D; color: #F4F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
      <div aria-busy="true" aria-label="Loading" style="display: flex; flex-direction: column; gap: 16px">
        <span class="sk" style="width: 120px; height: 14px"></span>
        <span class="sk" style="width: 230px; height: 44px; border-radius: 12px"></span>
        <span class="sk" style="width: 200px; height: 14px"></span>
        <span class="sk" style="width: 100%; height: 140px; border-radius: 18px"></span>
        <span class="sk" style="width: 100%; height: 36px; border-radius: 999px"></span>
        <span class="sk" style="width: 100%; height: 60px; border-radius: 18px"></span>
        <span class="sk" style="width: 100%; height: 56px; border-radius: 14px"></span>
        <span class="sk" style="width: 100%; height: 56px; border-radius: 14px"></span>
      </div>
    </sc-if>
    <sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
    <div style="display: contents">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A1A8B3"><span class="live-dot" aria-hidden="true" style="width: 8px; height: 8px; background: #3DDC97"></span>Running · 6 s ago</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #0A0B0D; background: #F5B64C; border-radius: 999px; padding: 4px 9px">PAPER · HUNTER</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; color: #A1A8B3">Pot, after costs</span>
      <span class="num" style="font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1">$5,021.57</span>
      <span class="num" style="font-size: 15px; font-weight: 500; color: #3DDC97">▲ +$21.57 · +0.43% · today +$12.85</span>
    </div>
    <svg viewBox="0 0 350 140" role="img" aria-label="Pot rising 0.84% since the start while SPY fell 0.21%" style="width: 100%; height: auto">
      <defs><linearGradient id="mf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F95F0" stop-opacity="0.28"></stop><stop offset="1" stop-color="#4F95F0" stop-opacity="0"></stop></linearGradient></defs>
      <line x1="0" y1="100" x2="350" y2="100" stroke="#262A31" stroke-dasharray="3 4"></line>
      <g class="rise" style="transform-origin: 0 140px">
      <path d="M0 100 L32 98 L64 96 L95 97 L127 94 L159 92 L191 93 L223 89 L255 87 L286 85 L318 84 L350 82 L350 140 L0 140 Z" fill="url(#mf)"></path>
      <path d="M0 100 L32 101 L64 99 L95 100 L127 102 L159 101 L191 103 L223 101 L255 102 L286 100 L318 102 L350 101" fill="none" stroke="#C4862F" stroke-width="2" stroke-dasharray="5 4"></path>
      <path d="M0 100 L32 98 L64 96 L95 97 L127 94 L159 92 L191 93 L223 89 L255 87 L286 85 L318 84 L350 82" fill="none" stroke="#4F95F0" stroke-width="2.5" stroke-linejoin="round"></path>
      </g>
    </svg>
    <div role="group" aria-label="Chart range" style="display: flex; justify-content: space-between">
      <button type="button" style="height: 36px; width: 64px; border-radius: 999px; border: 0; background: transparent; color: #A1A8B3; font: inherit; font-size: 14px; font-weight: 600">1D</button>
      <button type="button" style="height: 36px; width: 64px; border-radius: 999px; border: 0; background: transparent; color: #A1A8B3; font: inherit; font-size: 14px; font-weight: 600">1W</button>
      <button type="button" style="height: 36px; width: 64px; border-radius: 999px; border: 0; background: transparent; color: #A1A8B3; font: inherit; font-size: 14px; font-weight: 600">1M</button>
      <button type="button" aria-pressed="true" style="height: 36px; width: 64px; border-radius: 999px; border: 0; background: #F4F5F7; color: #0A0B0D; font: inherit; font-size: 14px; font-weight: 600">ALL</button>
    </div>
    <div style="background: #131519; border: 1px solid #262A31; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div class="num" style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #A1A8B3">Day vs daily stop</span><span><b style="color: #3DDC97">+$12.85</b> <span style="color: #7E8693">/ −$150</span></span></div>
      <div style="position: relative; height: 6px; border-radius: 6px; background: #1B1E24" aria-hidden="true"><div class="grow" style="position: absolute; left: 50%; width: 6%; height: 6px; border-radius: 0 6px 6px 0; background: #3DDC97"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 17px; font-weight: 600; padding-bottom: 6px">Open positions</span>
      <a href="TradeDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; color: #F4F5F7; text-decoration: none; border-bottom: 1px solid #1B1E24">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #1E3A5F; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">GE</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">GE Aerospace</strong><span class="num" style="font-size: 13px; color: #7E8693">3 sh · in at $306.67</span></span>
        <span style="text-align: right; display: flex; flex-direction: column; gap: 2px"><span class="num" style="font-size: 15px; font-weight: 600">$309.10</span><span class="num" style="font-size: 13px; font-weight: 600; color: #3DDC97">▲ +$7.29</span></span>
      </a>
      <a href="TradeDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; color: #F4F5F7; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #3A2E1A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">COP</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">ConocoPhillips</strong><span class="num" style="font-size: 13px; color: #7E8693">8 sh · in at $116.87</span></span>
        <span style="text-align: right; display: flex; flex-direction: column; gap: 2px"><span class="num" style="font-size: 15px; font-weight: 600">$116.40</span><span class="num" style="font-size: 13px; font-weight: 600; color: #FF6B6B">▼ −$3.76</span></span>
      </a>
    </div>
    </div>
    </sc-if>
  </div>
  <nav aria-label="Main" style="flex: none; display: flex; justify-content: space-around; padding: 10px 8px 22px; border-top: 1px solid #1B1E24; background: #0A0B0D">
    <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; color: #F4F5F7; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H14 V14 H10 V20 H3 Z" stroke-linejoin="round"></path></svg>Home</a>
    <a href="Trades.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; color: #7E8693; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H14" stroke-linecap="round"></path></svg>Trades</a>
    <a href="Report.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; color: #7E8693; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20 V12 M12 20 V5 M19 20 V9" stroke-linecap="round"></path></svg>Report</a>
    <a href="Engine.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; color: #7E8693; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12 H7 L10 5 L14 19 L17 12 H21" stroke-linecap="round" stroke-linejoin="round"></path></svg>Engine</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; color: #7E8693; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3 V6 M12 18 V21 M3 12 H6 M18 12 H21 M5.6 5.6 L7.8 7.8 M16.2 16.2 L18.4 18.4 M5.6 18.4 L7.8 16.2 M16.2 7.8 L18.4 5.6" stroke-linecap="round"></path></svg>Run</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showLoading":{"editor":"boolean","default":false,"section":"States"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this._t = setTimeout(() => this.setState({ ready: true }), 1100); }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() { const loading = !!this.props.showLoading || !(this.state && this.state.ready); return { loading: loading, ready: !loading }; }
}
</script>
</body>
</html>
