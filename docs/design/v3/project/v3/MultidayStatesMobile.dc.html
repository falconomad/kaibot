/* motion: one easing, short durations; everything stops for prefers-reduced-motion */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
@keyframes kb-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes kb-fade{from{opacity:0}to{opacity:1}}
@keyframes kb-draw{to{stroke-dashoffset:0}}
@keyframes kb-pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
@keyframes kb-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter{animation:kb-rise .55s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:kb-draw 1.3s var(--ease) .25s forwards}
.fade{animation:kb-fade .6s var(--ease) .9s both}
.grow{transform-origin:left;animation:kb-grow .8s var(--ease) .3s both}
.live-dot{border-radius:999px;animation:kb-pulse 2s infinite}
.morph{transition:d .45s var(--ease),cy .45s var(--ease)}
.press{transition:transform .15s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),opacity .2s}
.press:hover{filter:brightness(1.12)}.press:active{transform:scale(.97)}
.lift{transition:transform .2s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease)}
.lift:hover{transform:translateY(-2px);border-color:#3A404A}
.row{transition:background-color .2s var(--ease)}.row:hover{background:#1B1E24}
.swap{animation:kb-rise .35s var(--ease) both}
.tabbar{display:none}
@media (max-width: 760px){
  .topnav{display:none!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-around;padding:8px 8px 20px;background:rgba(10,11,13,.92);backdrop-filter:blur(12px);border-top:1px solid #1B1E24}

  .card{border-radius:20px!important;padding:16px!important}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}

@keyframes kb-ring{from{stroke-dasharray:0 239}}

.rise-bar{transform-box:view-box;animation:kb-riseY .8s var(--ease) both}

.ring{animation:kb-ring 1.1s var(--ease) .3s both}
.sk{display:block;background:linear-gradient(90deg,#16181C 0%,#23272E 50%,#16181C 100%);background-size:1200px 100%;animation:kb-shimmer 1.5s linear infinite;border-radius:10px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
