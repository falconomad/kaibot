# The research runner's allow-list (scripts/research_runner.py, docs/ops/research_runner.md).
# Only the entries below can ever be run from ops/runner/queue.yaml. Each entry is a script under scripts/ or a
# module under src/kaibot/; nothing else (no shell, no other path, no other interpreter flag).
#
#   flags:       the only arguments a job may pass. `null` = a switch without a value; otherwise a regular expression
#                the whole value must match (anchored by the runner). Anything else is rejected, and so are
#                --env, --data, --out, --root, --trials and --open-holdout (the runner adds --env itself).
#   env:         true = the runner appends `--env ~/Projects/kaibot-secrets/.env`. The runner never opens that file.
#   heavy:       true = started under `nice -n 10` (market hours are allowed, #600, 24 Nov 2026).
#   sec:         true = calls SEC EDGAR in bulk: never two at once (see sec_process_patterns).
#   timeout_min: the job is killed (its whole process group) after this many minutes.
#   writes:      folders under docs/ (ending in "/") the job may change in the checkout. After the job, changes only
#                there are committed on runner/<job id> and opened as a pull request (never pushed to main), and the
#                checkout goes back to clean main. Any change anywhere else pauses the runner until it is clean.
#
# Changing this file widens what Product can run on the owner's Mac: it needs the QA-Ops key and the owner.

repo: falconomad/kaibot          # where results are posted (issue comments)
max_jobs_per_run: 5              # at most this many new jobs per 15-minute tick
tail_lines: 150                  # lines of output posted per job
# Other processes on the Mac that call SEC EDGAR in bulk. A sec job is deferred to the next tick while one of these
# runs (as well as while the runner's own SEC lock is held).
sec_process_patterns:
  - fetch_sec_fundamentals
  - fetch_earnings_dates
  - fetch_fundamentals
  - fetch_spinoffs
  - fetch_listings
  - fetch_sp500_history

scripts:
  # --index-cap (#458, #459, #710): only the three pre-registered index caps at Hunter, 27 (the config, prereg
  # Amendment 3), 80 (research only, Amendment 4 of docs/prereg/index_core.md / Amendment 3 of
  # index_core_trend_momentum.md, Product 25 Nov 2026) and 97 (research only, the original design run once as a
  # consistency check: Amendment 6 of both, Product 26 Nov 2026, #710). Only these two scripts take the flag; the
  # scripts refuse any other value too. The live cap and the hard ceiling stay 27.
  scripts/index_core.py:
    heavy: true
    timeout_min: 180
    flags:
      <<: &replay_flags
        --start: '\d{4}-\d{2}-\d{2}'
        --end: '\d{4}-\d{2}-\d{2}'
        --universe: 'pit|today'
        --fixture: null
      --index-cap: '27|80|97'

  scripts/index_core_book.py:
    heavy: true
    timeout_min: 240
    flags:
      <<: *replay_flags
      --control-runs: '[1-9][0-9]{0,2}'
      --index-cap: '27|80|97'

  scripts/trend_momentum_gbm.py:
    heavy: true
    timeout_min: 240
    flags:
      <<: *replay_flags
      --cost-model: 'v1|v2'
      --control-runs: '[1-9][0-9]{0,2}'

  scripts/fetch_sec_fundamentals.py:
    env: true
    heavy: true
    sec: true
    timeout_min: 120
    flags:
      --refresh: null
      --max-age-days: '[0-9]{1,3}(\.[0-9]{1,2})?'
      --limit: '[1-9][0-9]{0,3}'
      --build: null
      --status: null

  # #376 (S102): the new-listing history. `--since 2016-01-01` reads EDGAR's quarterly indexes (about 45 SEC
  # requests, SEC_USER_AGENT from the .env); `--first-bars` (#664) reads first sessions from Alpaca daily bars with
  # the paper keys (data host only, 40 a minute, resumable). Both read the env file, so the runner adds --env.
  # Writes data/listings/ only (ignored), so no `writes`. Not --prices (a few thousand SEC requests, ~500 MB),
  # not --show/--eligible (free text and dates for offline reads), never --data/--daily/--root/--env.
  scripts/fetch_listings.py:
    env: true
    heavy: true
    sec: true
    timeout_min: 120
    flags:
      --since: '20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])'
      --first-bars: null
      --limit: '[1-9][0-9]{0,3}'
      --status: null
      --build: null
      --report: null

  # #708 (audit 2 6.8): the re-runs of the 11 runs the gate v3 re-score could not score (no exposure column; #678
  # added the column to these writers). Strict patterns: --end is the last research session ONLY (the hold-out guard
  # refuses later ends as well), and only the rules and experiments of those runs. Nothing else of these scripts:
  # no --start, --level, --grid, --costs, --control-runs, --has or --summary; their defaults are the earlier runs'.
  # Every re-run logs trial rows, so it counts in the registry (walk_forward: the tuned row's n_trials is the whole
  # grid x folds; oneshots: n_trials 1 per configuration at the base fill and 1x; spy_cost_rerun: n_trials 1).
  # walk_forward.py requires --env (FRED key for the VIX file; the runner adds the path, never opens it).
  # Not scripts/spy_engine.py: the runner refuses any target named *_engine.* (FORBIDDEN_TARGET), so its three runs
  # are for the owner to start by hand (#708).
  scripts/walk_forward.py:
    env: true
    heavy: true
    timeout_min: 90
    flags:
      --end: '2024-12-31'
      --experiment: 'control|high_vix|mornings|mornings_wide_stop|wide_stop'

  scripts/oneshots.py:
    heavy: true
    timeout_min: 60
    flags:
      --end: '2024-12-31'
      --rule: 'news_continuation|orb_stocks_in_play'

  scripts/spy_cost_rerun.py:
    heavy: true
    timeout_min: 120
    flags:
      --end: '2024-12-31'

  scripts/export_results.py:
    timeout_min: 20
    writes: [docs/research/results/]
    flags:
      --rule: '[a-z0-9_]{1,64}'

  # #454 (docs/prereg/trend_momentum.md Amendment 31): trend_momentum's base configuration at the closing print and
  # at the 15:50 price (reads data/daily and data/bars_1m up to --end; the hold-out guard refuses a later end).
  scripts/near_close_1550_rerun.py:
    heavy: true
    timeout_min: 120
    flags:
      <<: *replay_flags

  # #456: the gate v3 re-score of the reports already on the Mac (sleeves and, since #456, books). It runs no rule,
  # loads no price bar and logs no trial; it reads data/reports, data/trials.jsonl and the T-bill file, and writes
  # docs/research/results/gate_v3_rescore.md and .json (opened as a PR by the runner). No flags: --data, --out and
  # --root are never allowed.
  scripts/gate_v3_rescore.py:
    timeout_min: 20
    writes: [docs/research/results/]
    flags: {}

  scripts/market_alarm_report.py:
    heavy: true
    timeout_min: 60
    flags:
      --start: '\d{4}-\d{2}-\d{2}'
      --end: '\d{4}-\d{2}-\d{2}'
      --flags-only: null
      --rankings-only: null

  # The golden set's stub run only: --live spends money (stakeholder decision) and --record writes a tracked file.
  kaibot.agents.evalset.golden:
    timeout_min: 20
    flags: {}

  # #371: the shadow rules' results, as the HELPER (docs/ops/helper_role.md): it reads only helper.env (publishable
  # key + helper user; refused if it holds a service key), calls the read-only kb_helper_shadow_results() of
  # migration 0047 and prints scripts/shadow_results.sh's four tables. No --env (never the engine's .env, never
  # DATABASE_URL), no flags, no writes. Without 0047 it prints that the migration is not applied and exits 3.
  scripts/shadow_results.py:
    timeout_min: 10
    flags: {}

  # #797 (decision 20): the Alpha Vantage EARNINGS backfill, free tier only, research only. At most 20 requests a
  # UTC day (the script refuses --budget above 23; the key's 25 a day are shared with the owner), 13 s apart, and it
  # stops on AV's rate-limit answer. Its key is ALPHAVANTAGE_API_KEY in data.env, which the script reads itself (only
  # that name); `env` passes the .env path as a fall-back. No key: a WARNING and exit 0. Writes data/earnings/
  # alphavantage/ only (ignored), so no `writes`. heavy: true only so that it never runs in the quiet window around
  # the close (it is light: ~5 minutes of waiting). --status sends nothing. First, once a UTC day, it fetches the
  # upcoming-earnings calendar (1 request of the same budget; the backfill gets the rest) and writes it, display
  # only, with the .env's service key to kaibot.earnings_calendar (migration 0054); --no-calendar skips that.
  scripts/fetch_av_earnings.py:
    env: true
    heavy: true
    timeout_min: 15
    flags:
      --budget: '[0-9]|1[0-9]|2[0-3]'
      --no-calendar: null
      --status: null

  # #794 (decision 19 option B, follows #707): the 15:45-15:59 ET SIP minutes of every point-in-time S&P 500 member,
  # 2016 to the research window's end (the script refuses a later --end: nothing from the hold-out), with the paper
  # keys (data host only). Shared `alpaca` budget; at most --per-min a minute (default 40, the slow rate beside the
  # engine; the script refuses above 120, the pattern above 99). Resumable by month: --max-minutes stops it between
  # units before the timeout, so several queued jobs finish the backfill. heavy: paused in the quiet window around
  # the close. Writes data/bars_1550/ only (ignored), so no `writes`. --status and --report send nothing.
  # Never --data, --universe-file or --start (the defaults are the store, the universe file and 2016-01-04).
  scripts/fetch_minute_pit.py:
    env: true
    heavy: true
    timeout_min: 240
    flags:
      --end: '20(1[6-9]|2[0-4])-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])'
      --per-min: '[1-9][0-9]?'
      --max-minutes: '[1-9][0-9]{0,2}'
      --limit: '[1-9][0-9]{0,4}'
      --status: null
      --report: null
