# Research jobs for the runner on the owner's Mac (docs/ops/research_runner.md). Append a job; never edit or reuse
# the id of one that ran (done ids are skipped). The runner picks up main every 15 minutes and posts the last lines
# of output as a comment on `posts_to_issue`.
#
#   - id: sec-status-2026-11-24          # unique; letters, digits, . _ - (max 64)
#     script: scripts/fetch_sec_fundamentals.py   # must be a key of ops/runner/allowed.yaml
#     args: ["--status"]                 # only the flags allowed.yaml lists for that script
#     posts_to_issue: 600
jobs:
  - id: index-core-2026-11-24
    script: scripts/index_core.py
    args: ["--end", "2024-12-31"]
    posts_to_issue: 458
  - id: index-core-book-2026-11-24
    script: scripts/index_core_book.py
    args: ["--end", "2024-12-31"]
    posts_to_issue: 459
  - id: results-export-2026-11-25
    script: scripts/export_results.py
    args: []
    posts_to_issue: 452
  - id: shadow-results-2026-11              # #371's monthly report, as the helper (no write-capable key)
    script: scripts/shadow_results.py
    args: []
    posts_to_issue: 371
  - id: market-alarm-amend1-2026-11-25      # #377: the post-Amendment-1 run (#596): logs megacap_report M1, the 8th row
    script: scripts/market_alarm_report.py
    args: ["--start", "2016-01-01", "--end", "2024-12-31"]
    posts_to_issue: 377
  - id: index-core-80-2026-11-25          # #458 prereg Amendment 4: the core at an 80% index cap (research only)
    script: scripts/index_core.py
    args: ["--end", "2024-12-31", "--index-cap", "80"]
    posts_to_issue: 458
  - id: index-core-book-80-2026-11-25     # #459 prereg Amendment 3: the book with its core at 80% (research only)
    script: scripts/index_core_book.py
    args: ["--end", "2024-12-31", "--index-cap", "80"]
    posts_to_issue: 459
  - id: gate-v3-rescore-books-2026-11-25  # #456: the re-score with the book test, after the 80% runs above
    script: scripts/gate_v3_rescore.py
    args: []
    posts_to_issue: 456
  - id: near-close-1550-2026-11-25        # #454: trend_momentum at the closing print and at the 15:50 price
    script: scripts/near_close_1550_rerun.py
    args: ["--end", "2024-12-31"]
    posts_to_issue: 454
